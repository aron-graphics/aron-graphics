# Zeichnet die Beitrags-Heatmap neu und legt sie zurück ins Repo, falls sich
# etwas geändert hat. Läuft nachts, lässt sich aber von Hand anstoßen.
name: Heatmap

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heatmap
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # HEATMAP_TOKEN ist ein PAT mit read:user. Ohne ihn sieht der Lauf nur
      # öffentliche Beiträge — und bricht ab, statt eine leere Karte zu commiten.
      - name: Rendern
        env:
          HEATMAP_TOKEN: ${{ secrets.HEATMAP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node heatmap.mjs --login "${{ github.repository_owner }}" --out assets --require-data

      - name: Zurücklegen, falls anders
        run: |
          if git diff --quiet -- assets; then
            echo "Die Karte steht schon auf dem heutigen Stand."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'change: Die Heatmap zeigt den heutigen Stand'
          git push
