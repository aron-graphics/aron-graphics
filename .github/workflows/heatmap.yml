# Zeichnet die Beitrags-Heatmap neu und legt sie zurück ins Repo, falls sich
# etwas geändert hat. Läuft nachts, lässt sich aber von Hand anstoßen.
name: Heatmap

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heatmap
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Das eingebaute GITHUB_TOKEN genügt, solange im Profil "Include private
      # contributions" an ist: die privaten Tage kommen dann als freigegebene
      # Zählwerte, die jeder Token sieht. HEATMAP_TOKEN ist nur der Notnagel,
      # falls der Schalter je ausgeht. --require-data bricht lieber ab, als eine
      # leere oder erfundene Karte zu commiten.
      - name: Rendern
        env:
          HEATMAP_TOKEN: ${{ secrets.HEATMAP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node heatmap.mjs --login "${{ github.repository_owner }}" --out assets --json docs/contributions.json --require-data

      - name: Zurücklegen, falls anders
        run: |
          if git diff --quiet -- assets docs; then
            echo "Die Karte steht schon auf dem heutigen Stand."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets docs
          git commit -m 'change: Die Heatmap zeigt den heutigen Stand'
          git push
